openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: IBN News Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: articles
  - name: auth
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /articles:
    get:
      operationId: listArticles
      tags: [articles]
      summary: List published articles
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"

  /articles/search:
    get:
      operationId: searchArticles
      tags: [articles]
      summary: Search articles by keyword and optional category
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"

  /articles/featured:
    get:
      operationId: getFeaturedArticles
      tags: [articles]
      summary: Get featured/breaking news articles
      responses:
        "200":
          description: Featured articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"

  /articles/summary:
    get:
      operationId: getArticlesSummary
      tags: [articles]
      summary: Get article counts by category
      responses:
        "200":
          description: Summary of articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticlesSummary"

  /articles/{id}:
    get:
      operationId: getArticle
      tags: [articles]
      summary: Get a single article (also increments view count)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Article detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Not found

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Admin/Editor login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthenticated

  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Register a new editor account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "409":
          description: Username already taken

  /admin/articles:
    get:
      operationId: adminListArticles
      tags: [admin]
      summary: List all articles (admin)
      responses:
        "200":
          description: All articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
    post:
      operationId: createArticle
      tags: [admin]
      summary: Create a new article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"

  /admin/articles/{id}:
    get:
      operationId: adminGetArticle
      tags: [admin]
      summary: Get article for editing (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Not found
    patch:
      operationId: updateArticle
      tags: [admin]
      summary: Update an article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Not found
    delete:
      operationId: deleteArticle
      tags: [admin]
      summary: Delete an article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /admin/editors:
    get:
      operationId: listEditors
      tags: [admin]
      summary: List all editors/admins (admin-role only)
      responses:
        "200":
          description: Editor list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EditorUser"
        "403":
          description: Admin role required
    post:
      operationId: createEditor
      tags: [admin]
      summary: Create a new editor account (admin-role only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEditorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorUser"
        "409":
          description: Username already taken

  /admin/editors/{id}:
    patch:
      operationId: updateEditor
      tags: [admin]
      summary: Update editor (password or role) - admin-role only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEditorInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorUser"
        "404":
          description: Not found
    delete:
      operationId: deleteEditor
      tags: [admin]
      summary: Remove an editor - admin-role only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Cannot delete own account
        "404":
          description: Not found

  /admin/engagement:
    get:
      operationId: getEngagement
      tags: [admin]
      summary: Get post engagement statistics
      responses:
        "200":
          description: Engagement data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Article:
      type: object
      required: [id, title, category, content, author, publishedAt, isFeatured, isBreaking, viewCount]
      properties:
        id:
          type: integer
        title:
          type: string
        subtitle:
          type: ["string", "null"]
        category:
          type: string
        content:
          type: string
        author:
          type: string
        imageUrl:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        isFeatured:
          type: boolean
        isBreaking:
          type: boolean
        viewCount:
          type: integer
        publishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    ArticleInput:
      type: object
      required: [title, category, content, author]
      properties:
        title:
          type: string
          minLength: 1
        subtitle:
          type: string
        category:
          type: string
        content:
          type: string
          minLength: 1
        author:
          type: string
        imageUrl:
          type: string
        videoUrl:
          type: string
        isFeatured:
          type: boolean
        isBreaking:
          type: boolean

    ArticleUpdate:
      type: object
      properties:
        title:
          type: string
        subtitle:
          type: string
        category:
          type: string
        content:
          type: string
        author:
          type: string
        imageUrl:
          type: string
        videoUrl:
          type: string
        isFeatured:
          type: boolean
        isBreaking:
          type: boolean

    ArticlesSummary:
      type: object
      required: [total, byCategory, breaking, featured]
      properties:
        total:
          type: integer
        breaking:
          type: integer
        featured:
          type: integer
        byCategory:
          type: array
          items:
            type: object
            required: [category, count]
            properties:
              category:
                type: string
              count:
                type: integer

    SearchResult:
      type: object
      required: [results, total, query, category]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Article"
        total:
          type: integer
        query:
          type: string
        category:
          type: string

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    SignUpInput:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"

    AdminUser:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string

    EditorUser:
      type: object
      required: [id, username, role, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
        lastLoginAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    CreateEditorInput:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    UpdateEditorInput:
      type: object
      properties:
        password:
          type: string
          minLength: 6

    EngagementStats:
      type: object
      required: [totalViews, topArticles, viewsByCategory]
      properties:
        totalViews:
          type: integer
        topArticles:
          type: array
          items:
            type: object
            required: [id, title, category, author, viewCount, publishedAt]
            properties:
              id:
                type: integer
              title:
                type: string
              category:
                type: string
              author:
                type: string
              viewCount:
                type: integer
              publishedAt:
                type: string
                format: date-time
        viewsByCategory:
          type: array
          items:
            type: object
            required: [category, views]
            properties:
              category:
                type: string
              views:
                type: integer
